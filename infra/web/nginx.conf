# Serves the Flutter web build from Cloud Run (WEB_HOST=cloudrun). Same caching rules as firebase.json.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml font/ttf font/otf application/octet-stream;

  # The app shell is never served stale: a visitor would keep running the previous build.
  location ~ ^/(index\.html|main\.dart\.js|flutter_bootstrap\.js|flutter\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
    add_header Cache-Control "no-cache";
  }
  location /canvaskit/ { add_header Cache-Control "public, max-age=86400"; }
  location /assets/ { add_header Cache-Control "public, max-age=3600"; }
  location / { try_files $uri $uri/ /index.html; }
}
