name: pocket
description: "Pocket: a finance app that builds itself around you"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  dio: ^5.11.1
  fl_chart: ^1.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  qr_flutter: ^4.1.0
  web: ^1.1.2
  intl: ^0.20.3
  web_socket_channel: ^3.0.3
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  # New or alpha packages: pinned exactly, each behind one adapter file (see CLAUDE.md).
  a2ui_flutter: 0.4.0
  a2ui_core: 0.8.0
  json_schema_builder: 0.1.7  # a2ui_core's schema type; needed to declare the Pocket catalog
  record: 7.2.0
  flutter_pcm_sound: 3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Localisations are generated on demand (`make l10n`) and committed:
  # the build-time generator fails on OneDrive-synced folders ("arb-dir doesn't allow reading and writing").
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
