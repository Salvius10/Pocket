<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Pocket: a finance app that builds itself around you">
  <meta name="theme-color" content="#0C0D0A">
  <meta name="color-scheme" content="dark">

  <!-- Add to Home Screen on iPhone: opens full screen, like an installed app. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pocket">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Pocket</title>

  <style>
    /* Shown while the app loads, in the app's own colours, so there is never a white flash. */
    html, body { margin: 0; height: 100%; background: #0C0D0A; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: #0C0D0A; transition: opacity .28s ease-out;
    }
    #boot img { width: 84px; height: 84px; border-radius: 18px; }
    #boot span { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .22em; color: #9D9B8F; }
    #boot i { display: block; width: 96px; height: 3px; background: #2B2D25; overflow: hidden; }
    #boot i::after { content: ""; display: block; width: 40%; height: 100%; background: #C8F169; animation: boot 1.1s ease-in-out infinite alternate; }
    @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #boot i::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-label="Loading Pocket">
    <img src="icons/Icon-192.png" alt="">
    <span>POCKET</span>
    <i></i>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.style.opacity = '0';
      setTimeout(function () { boot.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
