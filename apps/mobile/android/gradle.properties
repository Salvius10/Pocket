# The Flutter template asks for an 8 GB Gradle heap. On a 16 GB laptop with a browser open that
# starves the machine (it got the whole session killed once), so the build is kept small: a 2.5 GB
# heap, the Kotlin compiler inside the same process instead of its own daemon, and two workers.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
