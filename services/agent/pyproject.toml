[project]
name = "agent"
version = "0.1.0"
description = "Pocket agent: live voice mascot, UI composer, Pulse, guardrail. Never touches the database."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pocket-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "google-auth>=2.36",
  "requests>=2.32",
  "tzdata>=2024.2",
]

[project.optional-dependencies]
# The Gemini SDKs are heavy; GEMINI_MODE=fake runs without them. `make setup` installs them.
# google-adk 2.15.0 requires google-genai >=2.34,<3, so uv.lock pins the matching google-genai.
gemini = ["google-adk==2.15.0", "google-genai>=2.34,<3"]

[tool.uv.sources]
pocket-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
