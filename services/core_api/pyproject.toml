[project]
name = "core-api"
version = "0.1.0"
description = "Pocket core-api: money maths, ledger, insights, collab, nudges. Never calls an LLM."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pocket-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "httpx>=0.27",
  "google-auth>=2.36",
  "requests>=2.32",
  "tzdata>=2024.2",
]

[tool.uv.sources]
pocket-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core_api"]
