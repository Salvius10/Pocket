[project]
name = "pocket-synth"
version = "1.0.0"
description = "Synthetic data generator for Pocket (supplied with the v1 dataset; see data/README.md)"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.1", "openpyxl>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pocket_synth"]
