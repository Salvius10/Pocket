[project]
name = "pocket-common"
version = "0.1.0"
description = "Money formatting, LayoutSpec validator, A2UI builder and guard core shared by core-api and agent"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pocket_common"]
